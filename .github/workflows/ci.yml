name: ci

# 推送代码和合并请求时：编译、单元测试、打包 .app，启动一次并截图（产物里有截图，日志里也有 base64 版本）。
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  macos:
    name: 编译、测试、打包
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 选择最新的 Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
          swift --version
      - name: 编译
        run: swift build
      - name: 单元测试
        run: swift test
      - name: 打包 .app（本机架构）
        run: VERSION=0.0.0 ARCHS="" Scripts/build-app.sh
      - name: 冒烟启动并截图
        run: |
          support="$HOME/Library/Application Support/ProxySwitch"
          mkdir -p "$support" screenshots
          # 预置几套配置，面板里有内容可看。
          cat > "$support/config.json" <<'JSON'
          {"profiles":[{"id":"6D2F2A1E-0000-4000-8000-000000000001","name":"Clash","color":"#16a34a","kind":"http","host":"127.0.0.1","port":7890},
                       {"id":"6D2F2A1E-0000-4000-8000-000000000002","name":"公司代理","color":"#2563eb","kind":"http","host":"proxy.corp.example","port":3128},
                       {"id":"6D2F2A1E-0000-4000-8000-000000000003","name":"SOCKS 隧道","color":"#7c3aed","kind":"socks5","host":"127.0.0.1","port":1080}]}
          JSON
          open dist/ProxySwitch.app
          sleep 8
          if ! pgrep -x ProxySwitch >/dev/null; then
            echo "程序没有在运行"
            cat "$support/proxyswitch.log" || true
            exit 1
          fi
          open "proxyswitch://panel"; sleep 3
          screencapture -x screenshots/panel.png || true
          open "proxyswitch://settings"; sleep 4
          screencapture -x screenshots/settings.png || true
          cat "$support/proxyswitch.log" || true
          pkill -x ProxySwitch || true
          ls -la screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: ProxySwitch-macos
          path: dist/ProxySwitch-macos.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
      - name: 把截图以 base64 打进日志
        if: always()
        run: |
          cd screenshots || exit 0
          if [ -f panel.png ]; then
            width=$(sips -g pixelWidth panel.png | awk '/pixelWidth/{print $2}')
            cropw=640; croph=760
            if ! sips -c "$croph" "$cropw" --cropOffset 0 $((width - cropw)) panel.png --out panel-crop.png >/dev/null 2>&1; then
              cp panel.png panel-crop.png
            fi
            sips -s format jpeg -s formatOptions 75 panel-crop.png --out panel.jpg >/dev/null
          fi
          if [ -f settings.png ]; then
            sips -Z 1400 -s format jpeg -s formatOptions 70 settings.png --out settings.jpg >/dev/null
          fi
          for name in panel settings; do
            [ -f "$name.jpg" ] || continue
            echo "=====BEGIN $name.jpg====="
            base64 -b 76 -i "$name.jpg"
            echo "=====END $name.jpg====="
          done
