name: release

# 推送 v* 标签时：跑单元测试，打包通用二进制的 ProxySwitch.app（版本号取自标签），
# 用 CHANGELOG.md 里对应版本的内容创建 GitHub Release 并上传 zip 和校验和。
# Release 先以草稿创建，附件上传完才发布。
# 也可以在 Actions 页面手动运行：填一个标签名，标签不存在时在所选分支的最新提交上创建并推送，存在时重新上传附件。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签，例如 v0.1.0；不存在时在当前分支的最新提交上创建"
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    name: 打包并发布
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 确定要发布的提交
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "标签 $TAG 已存在，在它上面发布"
            git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
            git checkout -q "$TAG"
          else
            echo "标签 $TAG 不存在，在 $(git rev-parse --short HEAD) 上创建"
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi
      - name: 选择最新的 Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          swift --version
      - name: 单元测试
        run: swift test
      - name: 打包通用二进制的 .app
        run: |
          VERSION="${TAG#v}" Scripts/build-app.sh
          cd dist && shasum -a 256 ProxySwitch-macos.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          awk -v version="$VERSION" '/^## /{ if (printing) exit; if (index($0, version)) { printing = 1; next } } printing' CHANGELOG.md > notes.md
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "ProxySwitch for Mac $TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" dist/ProxySwitch-macos.zip dist/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false --latest
          echo "已发布到 https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
